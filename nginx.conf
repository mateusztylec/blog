server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind Cloudflare Tunnel + Traefik nginx sees http and port 8080,
    # so redirects must stay relative to keep the public https host.
    absolute_redirect off;

    # /pl/events/ -> /pl/events
    rewrite ^/(.+)/$ /$1 permanent;

    # Next.js export writes pages as /pl/events.html while links
    # have no extension: /pl/events -> pl/events.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    # Next.js assets are content-hashed, safe to cache forever
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
